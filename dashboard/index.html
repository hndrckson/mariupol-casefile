<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050809">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mariupol Casefile">
    <title>Mariupol Casefile</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="styles.css?v=casefile-v0-20260707-resources2">
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-title">Mariupol<br>Casefile</div>
          <div class="brand-mark" aria-hidden="true"></div>
        </div>
        <nav class="nav-list" id="primaryNav"></nav>
        <div class="sidebar-note">
          <strong>Evidence posture</strong>
          <span>Genocide indicators track coverage, not legal conclusions.</span>
        </div>
        <div class="sidebar-footer">
          <div class="status-dot"></div>
          <div>
            <span>Data integrity</span>
            <strong>Demo / public-source leads</strong>
          </div>
        </div>
      </aside>
      <div class="sidebar-scrim" id="sidebarScrim" data-menu-close aria-hidden="true"></div>

      <section class="workspace">
        <header class="commandbar">
          <button class="icon-button mobile-menu-button" id="mobileMenuButton" type="button" data-menu-toggle aria-label="Open navigation" aria-controls="primaryNav" aria-expanded="false">
            <i data-lucide="menu" aria-hidden="true"></i>
          </button>
          <label class="search-box" for="globalSearch">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="globalSearch" type="search" placeholder="Search evidence, incidents, locations..." autocomplete="off">
          </label>
          <div class="commandbar-controls">
            <button class="control-button" id="dateRangeButton" type="button">
              <i data-lucide="calendar-days" aria-hidden="true"></i>
              24 Feb 2022 - 31 May 2022
            </button>
            <button class="control-button" id="confidenceButton" type="button">
              <i data-lucide="filter" aria-hidden="true"></i>
              Confidence: All
            </button>
            <button class="control-button accent" id="quickImportButton" type="button">
              <i data-lucide="upload" aria-hidden="true"></i>
              Import layer
            </button>
          </div>
        </header>

        <main id="view" class="view" tabindex="-1"></main>
      </section>

      <aside class="inspector" id="inspector" aria-label="Inspector panel">
        <div class="empty-inspector">
          <i data-lucide="panel-right-open" aria-hidden="true"></i>
          <strong>Select a record</strong>
          <span>Evidence, incidents, connectors, map features, and legal elements open here.</span>
        </div>
      </aside>

      <input id="importFile" type="file" accept=".geojson,.json,.csv,.kml" hidden>
      <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    </div>

    <script src="vendor/lucide/lucide.min.js" defer></script>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="casefile-data.js?v=casefile-v0-20260707-resources2"></script>
    <script src="casefile-extra-data.js?v=casefile-v0-20260707-resources2"></script>
    <script src="app.js?v=casefile-v0-20260707-resources2"></script>
  </body>
</html>
