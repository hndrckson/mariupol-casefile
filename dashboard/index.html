<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mariupol Casefile Map</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="topbar-kicker">OSINT / PUBLIC MAP INGEST</div>
        <h1>Mariupol Casefile</h1>
        <p>Public map targets, coordinates, descriptions, and local image evidence</p>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <main class="map-shell">
      <section class="map-stage">
        <div id="map" class="map" aria-label="Mariupol target map"></div>

        <aside class="legend-panel" id="legendPanel" aria-label="Map legend">
          <div id="legend" class="legend"></div>
        </aside>

        <aside id="detailPanel" class="detail-panel" aria-live="polite">
          <section id="detail" class="detail">
            <div class="empty-state">
              <h2>Select a target</h2>
              <p>Click any point to inspect its description, coordinates, source links, and local image gallery.</p>
            </div>
          </section>
        </aside>

        <div class="mobile-actions" aria-label="Mobile map controls">
          <button id="legendToggle" type="button">Legend</button>
          <button id="detailToggle" type="button">Details</button>
        </div>
      </section>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="app.js?v=thumbs-20260629"></script>
  </body>
</html>
